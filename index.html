<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- X video CDN rejects playback requests carrying a third-party Referer. -->
    <meta name="referrer" content="no-referrer" />
    <script>
      try {
        const isLight = localStorage.getItem('theme') === 'light'
        document.documentElement.classList.toggle('dark', !isLight)
        document.documentElement.classList.toggle('light', isLight)
      } catch { /* Keep the default dark theme when storage is unavailable. */ }
    </script>
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vo1d Blog</title>
    <style>body { background: #000; margin: 0; } html.light body { background: #fff; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
